<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>Smart lamp</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --text: #15171c; --muted: #6b7280;
    --line: #e5e7eb; --chip: #f1f2f4; --hover: #e9eaee;
    --accent: #f59e0b; --accent-text: #1a1a1a; --danger: #dc2626; --ok: #16a34a;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --glow: #ffd9a0; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --card: #181b22; --text: #eef0f3; --muted: #9aa1ad;
            --line: #262a33; --chip: #21252d; --hover: #2a2f38; --shadow: none; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 34px; height: 34px; border-radius: 9px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  .conn { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex: none;
          background: var(--card); border: 1px solid var(--line); padding: 5px 10px; border-radius: 99px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--danger); }

  .layout { display: flex; flex-direction: column; gap: 14px; }
  .col { display: contents; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  #c-hero { order: 1; } #c-controls { order: 2; } #c-timer { order: 3; } #c-sched { order: 4; }

  /* hero */
  #c-hero { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding: 28px 18px 24px; }
  #c-hero::before { content: ""; position: absolute; inset: -40%; opacity: 0; transition: opacity .5s;
                    background: radial-gradient(circle at 50% 42%, var(--glow), transparent 55%); pointer-events: none; }
  #c-hero.on::before { opacity: .28; }
  #power { position: relative; width: 136px; height: 136px; border-radius: 50%; border: 0; cursor: pointer;
           background: var(--chip); color: var(--muted); transition: background .35s, box-shadow .35s, color .35s, transform .1s; }
  #power:hover { background: var(--hover); }
  #power:active { transform: scale(.97); }
  #power svg { width: 54px; height: 54px; }
  #power.on { background: var(--glow); color: #1a1a1a; box-shadow: 0 0 0 8px color-mix(in srgb, var(--glow) 25%, transparent), 0 0 60px 6px var(--glow); }
  #power-label { position: relative; margin-top: 18px; font-size: 18px; font-weight: 650; }
  #power-sub { position: relative; font-size: 13px; color: var(--muted); min-height: 19px; text-align: center; }

  /* tabs */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--chip); border-radius: 12px; padding: 4px; margin-bottom: 18px; }
  .tabs button { border: 0; background: transparent; padding: 9px; border-radius: 9px; cursor: pointer; color: var(--muted); }
  .tabs button:hover { color: var(--text); }
  .tabs button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); font-weight: 600; }

  label.row { display: flex; justify-content: space-between; margin: 16px 0 2px; font-size: 14px; }
  label.row span { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 30px; accent-color: var(--accent); cursor: pointer; }
  .gradient-range { -webkit-appearance: none; appearance: none; height: 12px !important; border-radius: 99px; margin: 12px 0; }
  .gradient-range::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.35); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .gradient-range::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid rgba(0,0,0,.35); }
  #temp { background: linear-gradient(90deg, #ffa94d, #fff4e2, #cfe4ff); }
  #bright { background: linear-gradient(90deg, #3a3a3a, var(--glow)); }

  .white-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 12px; }
  .swatch { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; cursor: pointer; padding: 0;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); transition: transform .12s; }
  .swatch:hover { transform: scale(1.08); }
  .swatch.sel { border-color: var(--text); }
  .swatch.custom { position: relative; overflow: hidden; background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); }
  .swatch.custom input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

  .scenes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .scene { border: 2px solid var(--line); background: var(--chip); border-radius: 14px; padding: 0; overflow: hidden;
           cursor: pointer; text-align: left; transition: border-color .15s, transform .12s; }
  .scene:hover { transform: translateY(-2px); }
  .scene.sel { border-color: var(--accent); }
  .scene .pv { height: 58px; }
  .scene .nm { display: block; padding: 8px 10px; font-size: 14px; font-weight: 550; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--chip); padding: 8px 14px; border-radius: 99px; font-size: 14px; cursor: pointer; }
  .chip:hover { background: var(--hover); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  #timer { display: grid; grid-template-columns: repeat(4, 1fr); }
  #timer .chip { text-align: center; padding: 9px 0; }
  #timer .chip.cancel { grid-column: 1 / -1; }

  /* schedules */
  .sched { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
  .sched:first-child { border-top: 0; padding-top: 0; }
  .sched .t { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; min-width: 70px; }
  .sched .d { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); }
  .sched .d b { display: block; color: var(--text); font-weight: 550; font-size: 14px; }
  .sched.off .t, .sched.off .d b { opacity: .45; }
  .icon-btn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px 8px; border-radius: 8px; font-size: 16px; }
  .icon-btn:hover { background: var(--hover); color: var(--danger); }
  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; cursor: pointer; }
  .switch i::after { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + i { background: var(--accent); }
  .switch input:checked + i::after { transform: translateX(18px); }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 6px 0 2px; }

  form#new { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 16px; }
  form#new .full { grid-column: 1 / -1; }
  input[type=time], select, input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
         background: var(--chip); color: var(--text); font: inherit; min-height: 42px; }
  .chips.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .days .chip { padding: 8px 0; text-align: center; }
  button.primary { border: 0; border-radius: 10px; padding: 11px 18px; background: var(--accent); color: var(--accent-text); font-weight: 650; cursor: pointer; min-height: 42px; }
  button.primary:hover { filter: brightness(1.06); }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 100px); background: var(--danger); color: #fff;
           padding: 10px 16px; border-radius: 10px; font-size: 14px; transition: transform .25s; max-width: calc(100% - 32px); z-index: 9; }
  #toast.show { transform: translate(-50%, 0); }

  /* desktop */
  @media (min-width: 900px) {
    .wrap { padding: 28px 32px 56px; }
    header { margin-bottom: 24px; }
    h1 { font-size: 24px; }
    .layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
    .col { display: flex; flex-direction: column; gap: 20px; }
    .col.left { position: sticky; top: 24px; }
    .card { padding: 22px; }
    #c-hero { padding: 44px 22px 34px; }
    #power { width: 168px; height: 168px; }
    #power svg { width: 62px; height: 62px; }
    .scenes { grid-template-columns: repeat(4, 1fr); }
    .scene .pv { height: 72px; }
    .swatches { grid-template-columns: repeat(9, 1fr); }
    form#new { grid-template-columns: 130px 170px 1fr auto; align-items: center; }
    form#new > * { grid-row: 1; }
    form#new #n-value-wrap, form#new button.primary { grid-column: auto; }
    form#new .days-wrap { grid-row: 2; grid-column: 1 / -1; max-width: 440px; }
    .sched-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; }
    .sched-grid .sched:nth-child(2) { border-top: 0; padding-top: 0; }
  }
  @media (min-width: 1200px) {
    .layout { grid-template-columns: 380px 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="/static/icon.svg" alt=""><h1 id="name">Smart lamp</h1></div>
    <div class="conn"><span id="dot" class="dot"></span><span id="conn">conectando…</span></div>
  </header>

  <div class="layout">
    <div class="col left">
      <section class="card" id="c-hero">
        <button id="power" aria-label="Ligar/desligar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
        </button>
        <div id="power-label">—</div>
        <div id="power-sub"></div>
      </section>

      <section class="card" id="c-timer">
        <h2>Desligar em</h2>
        <div class="chips" id="timer">
          <button class="chip" data-min="15">15 min</button>
          <button class="chip" data-min="30">30 min</button>
          <button class="chip" data-min="60">1 h</button>
          <button class="chip" data-min="120">2 h</button>
          <button class="chip cancel" data-min="0" hidden>Cancelar timer</button>
        </div>
      </section>
    </div>

    <div class="col right">
      <section class="card" id="c-controls">
        <div class="tabs" role="tablist">
          <button data-tab="white" class="active">Branco</button>
          <button data-tab="colour">Cor</button>
          <button data-tab="scene">Cenas</button>
        </div>

        <div id="pane-white">
          <label class="row" for="temp">Temperatura <span id="temp-v"></span></label>
          <input id="temp" class="gradient-range" type="range" min="0" max="100" step="1">
          <div class="white-presets">
            <button class="chip" data-temp="0">Quente</button>
            <button class="chip" data-temp="50">Neutra</button>
            <button class="chip" data-temp="100">Fria</button>
          </div>
        </div>

        <div id="pane-colour" hidden>
          <div class="swatches" id="swatches">
            <label class="swatch custom" title="Personalizada"><input type="color" id="picker"></label>
          </div>
        </div>

        <div id="pane-scene" hidden>
          <div class="scenes" id="scenes"></div>
        </div>

        <div id="bright-wrap">
          <label class="row" for="bright">Brilho <span id="bright-v"></span></label>
          <input id="bright" class="gradient-range" type="range" min="1" max="100" step="1">
        </div>
      </section>

      <section class="card" id="c-sched">
        <h2>Agendamentos</h2>
        <div id="sched-list" class="sched-grid"></div>
        <form id="new">
          <input type="time" id="n-time" required value="18:30" aria-label="Horário">
          <select id="n-action" aria-label="Ação">
            <option value="on">Ligar</option>
            <option value="off">Desligar</option>
            <option value="white">Branco</option>
            <option value="color">Cor</option>
            <option value="brightness">Brilho</option>
            <option value="scene">Cena</option>
          </select>
          <div class="full" id="n-value-wrap">
            <input type="text" id="n-value" aria-label="Valor" disabled placeholder="sem valor">
            <select id="n-scene" aria-label="Cena" hidden></select>
          </div>
          <div class="full days-wrap"><div class="chips days" id="n-days"></div></div>
          <button class="primary full" type="submit">Adicionar</button>
        </form>
      </section>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const PRESETS = ["#ff0000", "#ff6400", "#ffc800", "#00ff00", "#00ffff", "#0000ff", "#8c00ff", "#ff0078"];
const DAYS = ["S", "T", "Q", "Q", "S", "S", "D"];  // seg..dom
const DAY_FULL = ["seg", "ter", "qua", "qui", "sex", "sáb", "dom"];
const ACTION_LABEL = { on: "Ligar", off: "Desligar", white: "Branco", color: "Cor", brightness: "Brilho", scene: "Cena" };
// visual previews for the built-in Tuya scenes
const SCENE_STYLE = {
  night:    { bg: "radial-gradient(circle at 30% 40%, #ffb15c, #3b2410 75%)", glow: "#ffb15c" },
  read:     { bg: "linear-gradient(135deg, #fff6e6, #ffd9a0)", glow: "#ffe2b0" },
  work:     { bg: "linear-gradient(135deg, #ffffff, #cfe2ff)", glow: "#e3eeff" },
  leisure:  { bg: "linear-gradient(135deg, #f6e7d4, #b99f80)", glow: "#f0dcc2" },
  soft:     { bg: "linear-gradient(135deg, #ff7a7a, #7dffa0 60%, #1f3a26)", glow: "#ffb0b0" },
  rainbow:  { bg: "linear-gradient(90deg, #ff2d2d 33%, #2dff6a 33% 66%, #2d6bff 66%)", glow: "#9fe" },
  shine:    { bg: "repeating-linear-gradient(90deg, #ff2d2d 0 12px, #111 12px 18px, #2dff6a 18px 30px, #111 30px 36px, #2d6bff 36px 48px, #111 48px 54px)", glow: "#fff" },
  gorgeous: { bg: "linear-gradient(90deg, #ff2d2d, #2dff6a, #2d6bff, #f5ff2d, #2dffe0, #b02dff)", glow: "#e0b0ff" },
};
let state = null, tab = "white", busy = false, scenes = [];

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 3500);
}

async function api(path, method = "GET", body) {
  const res = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    let detail = res.statusText;
    try { const j = await res.json(); detail = typeof j.detail === "string" ? j.detail : j.detail.map(d => d.msg).join("; "); } catch {}
    throw new Error(detail);
  }
  return res.status === 204 ? null : res.json();
}

function setConn(ok, text) {
  $("#dot").className = "dot " + (ok ? "ok" : "err");
  $("#conn").textContent = text;
}

function warmToHex(t) {  // 0 = warm, 100 = cold
  const a = [255, 179, 92], b = [207, 230, 255];
  return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t / 100).toString(16).padStart(2, "0")).join("");
}

// the bulb stores colour as HSV, so a hex read back can differ slightly from what was sent
function colorDistance(a, b) {
  const rgb = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [rgb(a), rgb(b)];
  return Math.max(...x.map((v, i) => Math.abs(v - y[i])));
}

function tempLabel(v) { v = +v; return v < 34 ? "quente" : v > 66 ? "fria" : "neutra"; }
const sceneLabel = (id) => scenes.find(s => s.id === id)?.label || id;

function render(s) {
  state = s;
  setConn(true, "online");
  const glow = s.mode === "colour" && s.color ? s.color
             : s.mode === "scene" && SCENE_STYLE[s.scene] ? SCENE_STYLE[s.scene].glow
             : warmToHex(s.temperature);
  document.documentElement.style.setProperty("--glow", glow);
  $("#power").classList.toggle("on", s.on);
  $("#c-hero").classList.toggle("on", s.on);
  $("#power-label").textContent = s.on ? "Ligada" : "Desligada";

  const parts = [];
  if (s.on) {
    if (s.mode === "scene") parts.push(`Cena ${sceneLabel(s.scene)}`);
    else if (s.mode === "colour") parts.push(`Cor · ${s.brightness}%`);
    else parts.push(`Branco ${tempLabel(s.temperature)} · ${s.brightness}%`);
  }
  if (s.timer_seconds > 0) parts.push(`desliga em ${Math.ceil(s.timer_seconds / 60)} min`);
  $("#power-sub").textContent = parts.join(" · ");
  $("#timer .cancel").hidden = !(s.timer_seconds > 0);

  const modeTab = { white: "white", colour: "colour", scene: "scene" }[s.mode];
  if (modeTab && !render.userTab) setTab(modeTab, false);

  if (document.activeElement !== $("#bright")) $("#bright").value = s.brightness;
  $("#bright-v").textContent = $("#bright").value + "%";
  if (document.activeElement !== $("#temp")) $("#temp").value = s.temperature;
  $("#temp-v").textContent = tempLabel($("#temp").value);
  if (s.color) $("#picker").value = s.color;
  document.querySelectorAll(".swatch[data-c]").forEach(el =>
    el.classList.toggle("sel", s.mode === "colour" && !!s.color && colorDistance(el.dataset.c, s.color) < 30));
  document.querySelectorAll(".scene").forEach(el =>
    el.classList.toggle("sel", s.mode === "scene" && el.dataset.id === s.scene));
}

async function act(path, body) {
  if (busy) return; busy = true;
  try { render.userTab = false; render(await api(path, "POST", body)); }
  catch (e) { toast(e.message); }
  finally { busy = false; }
}

async function refresh() {
  if (busy || document.hidden) return;
  try { render(await api("/api/status")); }
  catch (e) { setConn(false, "sem resposta"); }
}

function setTab(t, fromUser = true) {
  tab = t;
  if (fromUser) render.userTab = true;  // don't let polling flip the tab while browsing
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === t));
  $("#pane-white").hidden = t !== "white";
  $("#pane-colour").hidden = t !== "colour";
  $("#pane-scene").hidden = t !== "scene";
  $("#bright-wrap").hidden = t === "scene";
  if (fromUser && t === "white" && state?.mode !== "white") act("/api/white", {});
}

// --- controls
$("#power").onclick = () => act("/api/power", { on: !state?.on });
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setTab(b.dataset.tab));
$("#bright").oninput = (e) => $("#bright-v").textContent = e.target.value + "%";
$("#bright").onchange = (e) => act("/api/brightness", { value: +e.target.value });
$("#temp").oninput = (e) => $("#temp-v").textContent = tempLabel(e.target.value);
$("#temp").onchange = (e) => act("/api/white", { temperature: +e.target.value });
document.querySelectorAll("[data-temp]").forEach(b => b.onclick = () => act("/api/white", { temperature: +b.dataset.temp }));
$("#picker").onchange = (e) => act("/api/color", { color: e.target.value });
const sw = $("#swatches");
PRESETS.forEach(c => {
  const b = document.createElement("button");
  b.className = "swatch"; b.style.background = c; b.dataset.c = c; b.title = c; b.setAttribute("aria-label", c);
  b.onclick = () => act("/api/color", { color: c });
  sw.insertBefore(b, sw.lastElementChild);
});
document.querySelectorAll("#timer .chip").forEach(b => b.onclick = () => act("/api/timer", { minutes: +b.dataset.min }));

function renderScenes() {
  const el = $("#scenes"); el.innerHTML = "";
  const sel = $("#n-scene"); sel.innerHTML = "";
  for (const s of scenes) {
    const b = document.createElement("button");
    b.className = "scene"; b.dataset.id = s.id;
    b.innerHTML = `<div class="pv"></div><span class="nm"></span>`;
    b.querySelector(".pv").style.background = SCENE_STYLE[s.id]?.bg || "var(--hover)";
    b.querySelector(".nm").textContent = s.label;
    b.onclick = () => act("/api/scene", { scene: s.id });
    el.appendChild(b);
    sel.add(new Option(s.label, s.id));
  }
}

// --- schedules
const daysEl = $("#n-days");
const newDays = new Set([0, 1, 2, 3, 4, 5, 6]);
DAYS.forEach((d, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip on"; b.textContent = d; b.title = DAY_FULL[i];
  b.onclick = () => { newDays.has(i) ? newDays.delete(i) : newDays.add(i); b.classList.toggle("on", newDays.has(i)); };
  daysEl.appendChild(b);
});

$("#n-action").onchange = (e) => {
  const a = e.target.value, input = $("#n-value");
  $("#n-scene").hidden = a !== "scene";
  input.hidden = a === "scene";
  input.disabled = !["white", "color", "brightness"].includes(a);
  input.value = "";
  input.placeholder = { white: "temperatura 0-100 (vazio = manter)", color: "#ff8800 ou vermelho", brightness: "brilho 1-100" }[a] || "sem valor";
};

function describeDays(days) {
  if (days.length === 7) return "todos os dias";
  if (days.join() === "0,1,2,3,4") return "dias úteis";
  if (days.join() === "5,6") return "fim de semana";
  return days.map(d => DAY_FULL[d]).join(", ");
}

function describeAction(s) {
  const label = ACTION_LABEL[s.action];
  if (s.value === null || s.value === undefined || s.value === "") return label;
  if (s.action === "brightness") return `${label} ${s.value}%`;
  if (s.action === "white") return `${label} ${tempLabel(s.value)}`;
  if (s.action === "scene") return `${label} ${sceneLabel(s.value)}`;
  return `${label} ${s.value}`;
}

async function loadSchedules() {
  try {
    const list = await api("/api/schedules");
    const el = $("#sched-list");
    el.innerHTML = "";
    if (!list.length) { el.innerHTML = '<div class="empty">Nenhum agendamento</div>'; return; }
    for (const s of list) {
      const row = document.createElement("div");
      row.className = "sched" + (s.enabled ? "" : " off");
      row.innerHTML = `<div class="t"></div><div class="d"><b></b><span></span></div>
        <label class="switch" title="Ativar/desativar"><input type="checkbox"><i></i></label>
        <button class="icon-btn" title="Excluir" aria-label="Excluir">✕</button>`;
      row.querySelector(".t").textContent = s.time;
      row.querySelector("b").textContent = describeAction(s);
      row.querySelector("span").textContent = describeDays(s.days);
      const cb = row.querySelector("input");
      cb.checked = s.enabled;
      cb.onchange = async () => {
        try { await api(`/api/schedules/${s.id}`, "PUT", { ...s, enabled: cb.checked }); loadSchedules(); }
        catch (e) { toast(e.message); cb.checked = !cb.checked; }
      };
      row.querySelector(".icon-btn").onclick = async () => {
        if (!confirm(`Excluir agendamento das ${s.time}?`)) return;
        try { await api(`/api/schedules/${s.id}`, "DELETE"); loadSchedules(); } catch (e) { toast(e.message); }
      };
      el.appendChild(row);
    }
  } catch (e) { toast("Erro ao carregar agendamentos: " + e.message); }
}

$("#new").onsubmit = async (e) => {
  e.preventDefault();
  if (!newDays.size) return toast("Escolha pelo menos um dia");
  const action = $("#n-action").value;
  const raw = action === "scene" ? $("#n-scene").value : $("#n-value").value.trim();
  const body = { time: $("#n-time").value, days: [...newDays].sort(), action, value: raw === "" ? null : raw };
  try { await api("/api/schedules", "POST", body); loadSchedules(); }
  catch (err) { toast(err.message); }
};

(async () => {
  try {
    const info = await api("/api/info");
    $("#name").textContent = document.title = info.name;
    scenes = info.scenes;
    renderScenes();
  } catch (e) { toast(e.message); }
  refresh(); loadSchedules();
})();
setInterval(refresh, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refresh(); loadSchedules(); } });
</script>
</body>
</html>
